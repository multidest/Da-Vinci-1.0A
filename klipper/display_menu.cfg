# =====================================================================
# Winstar 1604 Display Menu Configuration for Da Vinci 1.0A
# Custom Menus: Filament (Stats, Set Menu, Operations, Drying) & Macros
# =====================================================================

# =====================================================================
# ACTIVE PRINT CONTROLS (DIRECT PAUSE, RESUME, CANCEL)
# =====================================================================

# Disable stock OctoPrint menu (which sends non-functional dummy action strings)
[menu __main __octoprint]
type: disabled

# Top-level print controls on Main menu during an active job
[menu __main __pause]
type: command
enable: {printer.idle_timeout.state == "Printing" and printer.print_stats.state != "paused"}
name: Pause Print
index: 1
gcode:
    PAUSE

[menu __main __resume]
type: command
enable: {printer.print_stats.state == "paused"}
name: Resume Print
index: 1
gcode:
    RESUME

[menu __main __cancel]
type: command
enable: {printer.idle_timeout.state == "Printing" or printer.print_stats.state == "paused"}
name: Cancel Print
index: 2
gcode:
    CANCEL_PRINT

# Add direct Pause/Resume/Cancel inside the Tune menu as well
[menu __main __tune __pause]
type: command
enable: {printer.print_stats.state != "paused"}
name: Pause Print
gcode:
    PAUSE

[menu __main __tune __resume]
type: command
enable: {printer.print_stats.state == "paused"}
name: Resume Print
gcode:
    RESUME

[menu __main __tune __cancel]
type: command
name: Cancel Print
gcode:
    CANCEL_PRINT


# ---------------------------------------------------------------------
# Temporary Storage & Commit Macro for Cartridge Configuration Menu
# ---------------------------------------------------------------------
[gcode_macro _CARTRIDGE_SETUP_VARS]
variable_mat_idx: 0
variable_materials: ['PLA', 'PETG', 'ABS', 'TPU']
variable_remaining_m: 200
gcode:

[gcode_macro SAVE_CARTRIDGE_SETUP]
description: Commit the configured material and remaining length to the cartridge EEPROM
gcode:
    {% set vars = printer['gcode_macro _CARTRIDGE_SETUP_VARS'] %}
    {% set mat = vars.materials[vars.mat_idx|int] %}
    {% set rem = vars.remaining_m|int %}
    RESPOND TYPE=echo MSG="Writing cartridge EEPROM: Type={mat}, Remaining={rem}m"
    CARTRIDGE_RESET MATERIAL={mat} LENGTH={rem} TOTAL={rem}
    M300 S1000 P100
    M117 Cartridge Saved


# =====================================================================
# OVERRIDE & EXTEND DEFAULT FILAMENT MENU
# =====================================================================

# Disable stock raw extrusion commands
[menu __main __filament __loadf]
type: disabled
[menu __main __filament __loads]
type: disabled
[menu __main __filament __unloadf]
type: disabled
[menu __main __filament __unloads]
type: disabled
[menu __main __filament __feed]
type: disabled

# ---------------------------------------------------------------------
# 1. Filament Stats (Live from EEPROM / Cartridge Reader)
# ---------------------------------------------------------------------
[menu __main __filament __stat_mat]
type: command
name: {"Mat: %s %s" % (printer.xyz_cartridge.material, printer.xyz_cartridge.color) if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else ("Mat: Unformatted" if ('xyz_cartridge' in printer and printer.xyz_cartridge.present) else "Mat: No Chip")}
gcode:
    CARTRIDGE_READ

[menu __main __filament __stat_rem]
type: command
name: {"Rem: %.1fm" % printer.xyz_cartridge.remaining_m if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else "Rem: N/A"}
gcode:
    CARTRIDGE_READ

[menu __main __filament __stat_used]
type: command
name: {"Used: %.1fm" % printer.xyz_cartridge.used_m if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else "Used: N/A"}
gcode:
    CARTRIDGE_READ

[menu __main __filament __stat_temp]
type: command
name: {"Temp: %dC/%dC" % (printer.xyz_cartridge.extruder_temp, printer.xyz_cartridge.bed_temp) if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else "Temp: N/A"}

# ---------------------------------------------------------------------
# 2. Set Menu (Configure Type + Remaining, then Save)
# ---------------------------------------------------------------------
[menu __main __filament __setup]
type: list
enable: {'xyz_cartridge' in printer and printer.xyz_cartridge.present}
name: Set Cartridge >

# Type selector: cycles PLA -> PETG -> ABS -> TPU
[menu __main __filament __setup __type]
type: input
name: {"Type: %s" % (printer['gcode_macro _CARTRIDGE_SETUP_VARS'].materials[menu.input|int])}
input: {printer['gcode_macro _CARTRIDGE_SETUP_VARS'].mat_idx}
input_min: 0
input_max: 3
input_step: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTRIDGE_SETUP_VARS VARIABLE=mat_idx VALUE={menu.input|int}

# Remaining length dial: 5m to 400m in 10m steps
[menu __main __filament __setup __rem]
type: input
name: {"Rem: %dm" % (menu.input|int)}
input: {printer['gcode_macro _CARTRIDGE_SETUP_VARS'].remaining_m}
input_min: 5
input_max: 400
input_step: 10
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTRIDGE_SETUP_VARS VARIABLE=remaining_m VALUE={menu.input|int}

# Save command to write values to EEPROM
[menu __main __filament __setup __save]
type: command
name: Save to Chip
gcode:
    SAVE_CARTRIDGE_SETUP

# ---------------------------------------------------------------------
# 3. Filament Operations & Manual Moves
# ---------------------------------------------------------------------
[menu __main __filament __load]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Load Filament
gcode:
    LOAD_FILAMENT

[menu __main __filament __unload]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Unload Filam.
gcode:
    UNLOAD_FILAMENT

[menu __main __filament __extrude_10]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Extrude 10mm
gcode:
    MANUAL_EXTRUDE DISTANCE=10 SPEED=200

[menu __main __filament __retract_10]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Retract 10mm
gcode:
    MANUAL_EXTRUDE DISTANCE=-10 SPEED=300

[menu __main __filament __manual_feed]
type: input
enable: {not printer.idle_timeout.state == "Printing"}
name: {"Manual E:%+dmm" % (menu.input|int)}
input: 10
input_min: -100
input_max: 100
input_step: 5
gcode:
    MANUAL_EXTRUDE DISTANCE={menu.input} SPEED=200

[menu __main __filament __clean]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Clean Nozzle
gcode:
    CLEAN_NOZZLE

# ---------------------------------------------------------------------
# 4. Filament Drying Section
# ---------------------------------------------------------------------
[menu __main __filament __drying]
type: list
name: Drying >

[menu __main __filament __drying __drop_bed]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Drop Bed
gcode:
    DRYER_DROP_BED

[menu __main __filament __drying __dry_pla]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Dry PLA (50C)
gcode:
    DRY_PLA

[menu __main __filament __drying __dry_petg]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Dry PETG (65C)
gcode:
    DRY_PETG

[menu __main __filament __drying __dry_abs]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Dry ABS (70C)
gcode:
    DRY_ABS

[menu __main __filament __drying __status]
type: command
name: Dryer Status
gcode:
    DRYER_STATUS

[menu __main __filament __drying __stop]
type: command
name: Stop Dryer
gcode:
    STOP_DRYER


# =====================================================================
# GENERAL MACROS MENU
# =====================================================================
[menu __main __macros]
type: list
name: Macros
index: 3

[menu __main __macros __case_light]
type: command
name: Light: {'ON ' if printer['output_pin Case_Light'].value else 'OFF'}
gcode:
    LIGHTS_TOGGLE

[menu __main __macros __clean_nozzle]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Clean Nozzle
gcode:
    CLEAN_NOZZLE

[menu __main __macros __exercise]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Exercise Axes
gcode:
    EXERCISE


# =====================================================================
# DEDICATED BED SCREWS TILT MENU
# =====================================================================
[menu __main __screws_tilt]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Screws Tilt >
index: 4

# 1. Action to initiate measurement
[menu __main __screws_tilt __measure]
type: command
name: Measure Tilt
gcode:
    SCREWS_TILT

# 2. Overall leveling status
[menu __main __screws_tilt __status]
type: command
name: {"Status: Level!" if ('screw2' in printer.screws_tilt_adjust.results and 'screw3' in printer.screws_tilt_adjust.results and printer.screws_tilt_adjust.results.screw2.adjust == '00:00' and printer.screws_tilt_adjust.results.screw3.adjust == '00:00') else ("Needs Adjusting" if 'screw1' in printer.screws_tilt_adjust.results else "Not Measured")}
gcode:
    SCREWS_TILT

# 3. Base Reference Screw (Rear Right)
[menu __main __screws_tilt __screw1]
type: command
name: {"Rear R: Base" if 'screw1' in printer.screws_tilt_adjust.results else "Rear R: --"}
gcode:
    SCREWS_TILT

# 4. Rear Left Screw Adjustment (CW/CCW and turns:minutes)
[menu __main __screws_tilt __screw2]
type: command
name: {"Rear L: Level" if ('screw2' in printer.screws_tilt_adjust.results and printer.screws_tilt_adjust.results.screw2.adjust == '00:00') else (("Rear L: %s %s" % (printer.screws_tilt_adjust.results.screw2.sign, printer.screws_tilt_adjust.results.screw2.adjust)) if 'screw2' in printer.screws_tilt_adjust.results else "Rear L: --")}
gcode:
    SCREWS_TILT

# 5. Front Screw Adjustment (CW/CCW and turns:minutes)
[menu __main __screws_tilt __screw3]
type: command
name: {"Front: Level" if ('screw3' in printer.screws_tilt_adjust.results and printer.screws_tilt_adjust.results.screw3.adjust == '00:00') else (("Front: %s %s" % (printer.screws_tilt_adjust.results.screw3.sign, printer.screws_tilt_adjust.results.screw3.adjust)) if 'screw3' in printer.screws_tilt_adjust.results else "Front: --")}
gcode:
    SCREWS_TILT


# =====================================================================
# LEGACY MENU OVERRIDES & ENHANCEMENTS
# =====================================================================

# 1. Rename "SD Card" to "Print Files"
[menu __main __sdcard]
type: vsdlist
enable: {('virtual_sdcard' in printer)}
name: Print Files

# 2. Fix Case Light in Control Menu (match Case_Light pin name and disable PWM)
[menu __main __control __caselightonoff]
type: input
enable: {'output_pin Case_Light' in printer}
name: Lights: {'ON ' if menu.input else 'OFF'}
input: {printer['output_pin Case_Light'].value}
input_min: 0
input_max: 1
input_step: 1
gcode:
    SET_PIN PIN=Case_Light VALUE={1 if menu.input else 0}

[menu __main __control __caselightpwm]
type: disabled

# 3. Modernize Z-offset baby-stepping for tactile push buttons (0.01mm step)
[menu __main __tune __offsetz]
type: input
name: Offset Z:{'%05.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -5
input_max: 5
input_step: 0.01
realtime: True
gcode:
    SET_GCODE_OFFSET Z={'%.3f' % menu.input} MOVE=1

# 4. Temperature Menu: Add Cartridge & PETG Preheats
[menu __main __temp __preheat_cartridge]
type: command
enable: {'xyz_cartridge' in printer and printer.xyz_cartridge.present}
name: {"Preheat %s (%d/%d)" % (printer.xyz_cartridge.material, printer.xyz_cartridge.extruder_temp, printer.xyz_cartridge.bed_temp) if ('xyz_cartridge' in printer and printer.xyz_cartridge.present) else "Preheat Spool"}
gcode:
    M140 S{printer.xyz_cartridge.bed_temp}
    M104 S{printer.xyz_cartridge.extruder_temp}

[menu __main __temp __preheat_petg]
type: list
name: Preheat PETG

[menu __main __temp __preheat_petg __all]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Preheat all (230/70)
gcode:
    M140 S70
    M104 S230

[menu __main __temp __preheat_petg __hotend]
type: command
enable: {'extruder' in printer}
name: Preheat hotend (230)
gcode:
    M104 S230

[menu __main __temp __preheat_petg __hotbed]
type: command
enable: {'heater_bed' in printer}
name: Preheat bed (70)
gcode:
    M140 S70

# 5. Clean Setup/Calibration Menu: Disable Delta items, add Probe/Mesh
[menu __main __setup __calib __delta_calib_auto]
type: disabled

[menu __main __setup __calib __delta_calib_man]
type: disabled

[menu __main __setup __calib __probe_calib]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Calib Probe Z
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    PROBE_CALIBRATE

[menu __main __setup __calib __bed_mesh]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Bed Mesh Calib
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CALIBRATE

