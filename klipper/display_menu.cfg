# =====================================================================
# Winstar 1604 Display Menu Configuration for Da Vinci 1.0A
# Custom Menus: Filament (Stats, Set Menu, Operations, Drying) & Macros
# =====================================================================

# ---------------------------------------------------------------------
# Temporary Storage & Commit Macro for Cartridge Configuration Menu
# ---------------------------------------------------------------------
[gcode_macro _CARTRIDGE_SETUP_VARS]
variable_mat_idx: 0
variable_materials: ['PLA', 'PETG', 'ABS', 'TPU']
variable_remaining_m: 200
gcode:

[gcode_macro SAVE_CARTRIDGE_SETUP]
description: Commit the configured material and remaining length to the cartridge EEPROM
gcode:
    {% set vars = printer['gcode_macro _CARTRIDGE_SETUP_VARS'] %}
    {% set mat = vars.materials[vars.mat_idx|int] %}
    {% set rem = vars.remaining_m|int %}
    RESPOND TYPE=echo MSG="Writing cartridge EEPROM: Type={mat}, Remaining={rem}m"
    CARTRIDGE_RESET MATERIAL={mat} LENGTH={rem} TOTAL={rem}
    M300 S1000 P100
    M117 Cartridge Saved


# =====================================================================
# OVERRIDE & EXTEND DEFAULT FILAMENT MENU
# =====================================================================

# Disable stock raw extrusion commands
[menu __main __filament __loadf]
type: disabled
[menu __main __filament __loads]
type: disabled
[menu __main __filament __unloadf]
type: disabled
[menu __main __filament __unloads]
type: disabled
[menu __main __filament __feed]
type: disabled

# ---------------------------------------------------------------------
# 1. Filament Stats (Live from EEPROM / Cartridge Reader)
# ---------------------------------------------------------------------
[menu __main __filament __stat_mat]
type: command
name: {"Mat: %s %s" % (printer.xyz_cartridge.material, printer.xyz_cartridge.color) if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else ("Mat: Unformatted" if ('xyz_cartridge' in printer and printer.xyz_cartridge.present) else "Mat: No Chip")}
gcode:
    CARTRIDGE_READ

[menu __main __filament __stat_rem]
type: command
name: {"Rem: %.1fm" % printer.xyz_cartridge.remaining_m if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else "Rem: N/A"}
gcode:
    CARTRIDGE_READ

[menu __main __filament __stat_used]
type: command
name: {"Used: %.1fm" % printer.xyz_cartridge.used_m if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else "Used: N/A"}
gcode:
    CARTRIDGE_READ

[menu __main __filament __stat_temp]
type: command
name: {"Temp: %dC/%dC" % (printer.xyz_cartridge.extruder_temp, printer.xyz_cartridge.bed_temp) if ('xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted) else "Temp: N/A"}

# ---------------------------------------------------------------------
# 2. Set Menu (Configure Type + Remaining, then Save)
# ---------------------------------------------------------------------
[menu __main __filament __setup]
type: list
enable: {'xyz_cartridge' in printer and printer.xyz_cartridge.present}
name: Set Cartridge >

# Type selector: cycles PLA -> PETG -> ABS -> TPU
[menu __main __filament __setup __type]
type: input
name: {"Type: %s" % (printer['gcode_macro _CARTRIDGE_SETUP_VARS'].materials[menu.input|int])}
input: {printer['gcode_macro _CARTRIDGE_SETUP_VARS'].mat_idx}
input_min: 0
input_max: 3
input_step: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTRIDGE_SETUP_VARS VARIABLE=mat_idx VALUE={menu.input|int}

# Remaining length dial: 5m to 400m in 10m steps
[menu __main __filament __setup __rem]
type: input
name: {"Rem: %dm" % (menu.input|int)}
input: {printer['gcode_macro _CARTRIDGE_SETUP_VARS'].remaining_m}
input_min: 5
input_max: 400
input_step: 10
gcode:
    SET_GCODE_VARIABLE MACRO=_CARTRIDGE_SETUP_VARS VARIABLE=remaining_m VALUE={menu.input|int}

# Save command to write values to EEPROM
[menu __main __filament __setup __save]
type: command
name: Save to Chip
gcode:
    SAVE_CARTRIDGE_SETUP

# ---------------------------------------------------------------------
# 3. Filament Operations
# ---------------------------------------------------------------------
[menu __main __filament __load]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Load Filament
gcode:
    LOAD_FILAMENT

[menu __main __filament __unload]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Unload Filam.
gcode:
    UNLOAD_FILAMENT

[menu __main __filament __clean]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Clean Nozzle
gcode:
    CLEAN_NOZZLE

# ---------------------------------------------------------------------
# 4. Filament Drying Section
# ---------------------------------------------------------------------
[menu __main __filament __drying]
type: list
name: Drying >

[menu __main __filament __drying __drop_bed]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Drop Bed
gcode:
    DRYER_DROP_BED

[menu __main __filament __drying __dry_pla]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Dry PLA (50C)
gcode:
    DRY_PLA

[menu __main __filament __drying __dry_petg]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Dry PETG (65C)
gcode:
    DRY_PETG

[menu __main __filament __drying __dry_abs]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Dry ABS (70C)
gcode:
    DRY_ABS

[menu __main __filament __drying __status]
type: command
name: Dryer Status
gcode:
    DRYER_STATUS

[menu __main __filament __drying __stop]
type: command
name: Stop Dryer
gcode:
    STOP_DRYER


# =====================================================================
# GENERAL MACROS MENU
# =====================================================================
[menu __main __macros]
type: list
name: Macros
index: 3

[menu __main __macros __case_light]
type: command
name: Light: {'ON ' if printer['output_pin Case_Light'].value else 'OFF'}
gcode:
    LIGHTS_TOGGLE

[menu __main __macros __screws_tilt]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Screws Tilt
gcode:
    SCREWS_TILT

[menu __main __macros __clean_nozzle]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Clean Nozzle
gcode:
    CLEAN_NOZZLE

[menu __main __macros __exercise]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Exercise Axes
gcode:
    EXERCISE
