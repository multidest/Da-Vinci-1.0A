# ======================================================================
# Filament Cartridge EEPROM Tracking, UI & Reset Macros
# ======================================================================

[gcode_macro CARTRIDGE_STATUS]
description: Display visual cartridge status in console and open interactive Fluidd dialog
gcode:
    {% if 'xyz_cartridge' in printer and printer.xyz_cartridge.present %}
        {% set cart = printer.xyz_cartridge %}
        {% if cart.formatted %}
            {% set total_m = (cart.total_mm / 1000.0) | round(1) %}
            {% set rem_m = cart.remaining_m | round(1) %}
            {% set used_m = cart.used_m | round(1) %}
            {% set print_m = (cart.used_this_print_mm / 1000.0) | round(2) %}
            {% set pct = ((cart.remaining_mm / cart.total_mm) * 100) | round(1) if cart.total_mm > 0 else 0 %}
            {% set fills = "████████████████████" %}
            {% set bars = "░░░░░░░░░░░░░░░░░░░░" %}
            {% set idx = [([((pct / 5.0)|round|int), 20]|min), 0]|max %}
            {% set gauge = fills[:idx] ~ bars[idx:] %}

            # 1. Output formatted visual card to console
            RESPOND TYPE=echo MSG="╔════════════════════════════════════════════════════╗"
            RESPOND TYPE=echo MSG="║             XYZ FILAMENT CARTRIDGE                 ║"
            RESPOND TYPE=echo MSG="╠════════════════════════════════════════════════════╣"
            RESPOND TYPE=echo MSG='{"║ Material   : %-39s║" % (cart.material ~ " (" ~ cart.color ~ ")")}'
            RESPOND TYPE=echo MSG='{"║ Remaining  : %-39s║" % (rem_m|string ~ "m / " ~ total_m|string ~ "m (" ~ pct|string ~ "%)")}'
            RESPOND TYPE=echo MSG='{"║ Gauge      : [%-20s] %-14s║" % (gauge, pct|string ~ "%")}'
            RESPOND TYPE=echo MSG='{"║ Lifetime   : %-39s║" % (used_m|string ~ "m used")}'
            RESPOND TYPE=echo MSG='{"║ This Print : %-39s║" % (print_m|string ~ "m used")}'
            RESPOND TYPE=echo MSG='{"║ Presets    : Extruder %dC  |  Bed %dC%-19s║" % (cart.extruder_temp, cart.bed_temp, "")}'
            RESPOND TYPE=echo MSG="╚════════════════════════════════════════════════════╝"

            # 2. Trigger interactive Fluidd Action Prompt modal
            RESPOND TYPE=command MSG="action:prompt_begin Filament Cartridge: {cart.material} ({cart.color})"
            RESPOND TYPE=command MSG="action:prompt_text Remaining: {rem_m}m / {total_m}m ({pct}%)"
            RESPOND TYPE=command MSG="action:prompt_text Gauge: [{gauge}]"
            RESPOND TYPE=command MSG="action:prompt_text Lifetime: {used_m}m | This Print: {print_m}m"
            RESPOND TYPE=command MSG="action:prompt_text Presets: Nozzle {cart.extruder_temp}°C | Bed {cart.bed_temp}°C"
            RESPOND TYPE=command MSG="action:prompt_button Preheat Spool ({cart.extruder_temp}C/{cart.bed_temp}C)|PREHEAT_CARTRIDGE|primary"
            RESPOND TYPE=command MSG="action:prompt_button Reset PLA (200m)|RESET_CARTRIDGE_PLA|secondary"
            RESPOND TYPE=command MSG="action:prompt_button Reset ABS (200m)|RESET_CARTRIDGE_ABS|secondary"
            RESPOND TYPE=command MSG="action:prompt_button Reset PETG (200m)|RESET_CARTRIDGE_PETG|secondary"
            RESPOND TYPE=command MSG="action:prompt_button Sync to Chip Now|CARTRIDGE_SYNC|secondary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|info"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% else %}
            RESPOND TYPE=echo MSG="XYZ Cartridge is detected but unformatted."
            RESPOND TYPE=command MSG="action:prompt_begin Filament Cartridge: Unformatted Chip"
            RESPOND TYPE=command MSG="action:prompt_text A chip is detected on the reader but contains no valid spool data."
            RESPOND TYPE=command MSG="action:prompt_button Format as PLA (200m, 210C/50C)|RESET_CARTRIDGE_PLA|primary"
            RESPOND TYPE=command MSG="action:prompt_button Format as ABS (200m, 240C/90C)|RESET_CARTRIDGE_ABS|primary"
            RESPOND TYPE=command MSG="action:prompt_button Format as PETG (200m, 230C/70C)|RESET_CARTRIDGE_PETG|primary"
            RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|info"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="No XYZ Cartridge chip detected on reader."
        RESPOND TYPE=command MSG="action:prompt_begin Filament Cartridge: Not Detected"
        RESPOND TYPE=command MSG="action:prompt_text No UNI/O cartridge chip is currently detected on the reader contact pin."
        RESPOND TYPE=command MSG="action:prompt_button Check Again|CARTRIDGE_READ|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|info"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro CARTRIDGE_PANEL]
description: Open the interactive Fluidd cartridge control panel
gcode:
    CARTRIDGE_STATUS

[gcode_macro PREHEAT_CARTRIDGE]
description: Preheat hotend and bed to active cartridge EEPROM temperatures
gcode:
    {% if 'xyz_cartridge' in printer and printer.xyz_cartridge.present and printer.xyz_cartridge.formatted %}
        {% set ext_temp = printer.xyz_cartridge.extruder_temp %}
        {% set bed_temp = printer.xyz_cartridge.bed_temp %}
        M117 Preheating Spool ({ext_temp}/{bed_temp})
        M140 S{bed_temp}
        M104 S{ext_temp}
        RESPOND TYPE=echo MSG="Preheating to cartridge presets: Extruder={ext_temp}C, Bed={bed_temp}C"
    {% else %}
        RESPOND TYPE=error MSG="No formatted cartridge detected to preheat"
    {% endif %}

[gcode_macro CARTRIDGE_PREHEAT]
description: Alias for PREHEAT_CARTRIDGE
gcode:
    PREHEAT_CARTRIDGE

[gcode_macro SET_FILAMENT_AMOUNT]
description: Set remaining filament amount in meters on the cartridge EEPROM
gcode:
    {% set LENGTH = params.LENGTH|default(200)|float %}
    CARTRIDGE_SET_REMAINING LENGTH={LENGTH}

[gcode_macro CARTRIDGE_SET_REMAINING_METERS]
description: Set remaining filament amount in meters on the cartridge EEPROM
gcode:
    {% set LENGTH = params.LENGTH|default(200)|float %}
    CARTRIDGE_SET_REMAINING LENGTH={LENGTH}

[gcode_macro RESET_CARTRIDGE_PLA]
description: Format/reset cartridge EEPROM for PLA spool (default 200m, 210C/50C)
gcode:
    {% set LENGTH = params.LENGTH|default(200)|float %}
    {% set COLOR = params.COLOR|default("White") %}
    CARTRIDGE_RESET LENGTH={LENGTH} TOTAL={LENGTH} MATERIAL=PLA COLOR={COLOR} EXTRUDER_TEMP=210 BED_TEMP=50
    M400
    CARTRIDGE_STATUS

[gcode_macro RESET_CARTRIDGE_ABS]
description: Format/reset cartridge EEPROM for ABS spool (default 200m, 240C/90C)
gcode:
    {% set LENGTH = params.LENGTH|default(200)|float %}
    {% set COLOR = params.COLOR|default("Blue") %}
    CARTRIDGE_RESET LENGTH={LENGTH} TOTAL={LENGTH} MATERIAL=ABS COLOR={COLOR} EXTRUDER_TEMP=240 BED_TEMP=90
    M400
    CARTRIDGE_STATUS

[gcode_macro RESET_CARTRIDGE_PETG]
description: Format/reset cartridge EEPROM for PETG spool (default 200m, 230C/70C)
gcode:
    {% set LENGTH = params.LENGTH|default(200)|float %}
    {% set COLOR = params.COLOR|default("Black") %}
    CARTRIDGE_RESET LENGTH={LENGTH} TOTAL={LENGTH} MATERIAL=PETG COLOR={COLOR} EXTRUDER_TEMP=230 BED_TEMP=70
    M400
    CARTRIDGE_STATUS

[gcode_macro SYNC_CARTRIDGE]
description: Immediately write tracked filament usage to the cartridge EEPROM
gcode:
    CARTRIDGE_SYNC
    M400
    CARTRIDGE_STATUS


# ======================================================================
# Front Panel Home Button Macro
# ======================================================================

[gcode_macro HOME_BUTTON]
description: Action triggered by the front panel Home button
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
        RESPOND TYPE=echo MSG="Home button pressed during print: ignoring G28 for safety"
    {% else %}
        RESPOND TYPE=echo MSG="Home button pressed: Homing"
        G28
    {% endif %}



