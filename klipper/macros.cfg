[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    {% set FIRST_LAYER_HEIGHT = params.FIRST_LAYER_HEIGHT|default(0.4)|float %}
    # BED_MESH_PROFILE LOAD=default
    M140 S{BED_TEMP} ; Bed (no wait)
    # M106 S255 ; Start fan (disabled during warm-up to prevent slow bed heating)
    G90 ; set absolute coordinates
    G28 ; home all axis
    M190 S{BED_TEMP} ; Bed (wait)
    M104 S{EXTRUDER_TEMP} ; Extruder (no wait)
    BED_MESH_CALIBRATE ADAPTIVE=1
    M109 S{EXTRUDER_TEMP} ; Extruder (wait)
    G92 E0 ; reset extrusion distance
    G1 E3 F600 ; Extrude
    M117 Cleaning
    CLEAN_NOZZLE
    M117 Start
    M300 s1000 p400 ; Beep
    M300 s1500 p400
    M300 s2000 p400
    M300 s2500 p400
    G1 X190 Y200 F6000 ; move nozzle to safe move zone
    G1 X1.0 Y170 F6000 ; move nozzle to priming area
    G1 Z{FIRST_LAYER_HEIGHT} F1000 ; move nozzle onto bed
    G92 E0 ; reset extrusion distance
    G1 X1.0 Y20 E15 F1000 ; first prime line
    G1 X1.4 Y20 F3000 ; step over
    G1 X1.4 Y170 E15 F1000 ; second prime line
    G92 E0 ; reset extrusion distance
    G1 E-0.5 F2100 ; small retract to prevent ooze
    G1 Z2.0 F3000 ; hop off bed
    G1 X5 Y170 F6000 ; wipe away from prime line
    M117 Printing

[gcode_macro END_PRINT]
gcode:
    M117 Done
    G92 E0 ; reset extrusion distance
    G1 E-3 F600 ; Retract 3mm to prevent oozing
    TURN_OFF_HEATERS ; Turn off extruder and bed
    M106 S0 ; Turn off part cooling fan
    G90 ; Absolute coordinates
    G1 Z195 F1000 ; Lower bed completely
    M117 Cleaning
    CLEAN_NOZZLE
    G1 X190 Y200 F6000 ; Return to safe print spot
    M84 ; Disable motors
    M117 Print Complete
    M300 s2500 p400 ; Beep
    M300 s2000 p400
    M300 s1500 p400
    M300 s1000 p400
    M117 Printer Ready

[gcode_macro CLEAN_NOZZLE]
gcode:
    # M106 S255 ; Start fan 
    G90 ; set absolute coordinates
    G1 X205 Y215 F3000
    G1 X225 Y215 F3000
    G1 X205 Y215 F3000
    G1 X225 Y215 F3000
    G1 X205 Y215 F3000
    G1 X225 Y215 F3000
    G1 X220 Y215 F3000
    G1 X220 Y190 F3000
    G1 X220 Y215 F3000
    G1 X220 Y190 F3000
    G1 X220 Y215 F3000
    G1 X220 Y190 F3000
    G1 X220 Y215 F3000
    G1 X225 Y215 F3000

[gcode_macro M100]
description: Alias for CLEAN_NOZZLE (stock Da Vinci cleaning routine)
gcode:
    CLEAN_NOZZLE

[gcode_macro EXERCISE]
gcode:
    # M106 S255 ; Start fan 
    G90 ; set absolute coordinates
    G1 X190 Y200 F6000
    G1 X0 Y200 F6000
    G1 X0 Y0 F6000
    G1 X190 Y0 F6000
    G1 X190 Y200 F6000



[gcode_macro SCREWS_TILT]
description: Probe all 3 bed leveling screws and calculate required adjustment turns
gcode:
    G28
    SCREWS_TILT_CALCULATE


[gcode_macro update_x_phase]
description: G-Code macro to update stepper phase in startup, run if you get stepper phase errors
gcode: 
    ENDSTOP_PHASE_CALIBRATE stepper=stepper_x

[gcode_macro update_y_phase]
gcode: 
    ENDSTOP_PHASE_CALIBRATE stepper=stepper_y
    
[gcode_macro update_z_phase]
gcode: 
    ENDSTOP_PHASE_CALIBRATE stepper=stepper_z


# This macro (M300) uses internal integrated beeper
# Just use it in your G-code for making sounds. Example: M300 S1000 P500
[gcode_macro M300]
gcode:
    {% set S = params.S|default(900)|float %}
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=buzz VALUE=0.95 CYCLE_TIME={ 1.0 / S | float }
    G4 P{P}
    SET_PIN PIN=buzz VALUE=0

[gcode_macro LIGHTS_ON]
description: Turn on chamber LED lights
gcode:
    SET_PIN PIN=Case_Light VALUE=1

[gcode_macro LIGHTS_OFF]
description: Turn off chamber LED lights
gcode:
    SET_PIN PIN=Case_Light VALUE=0

[gcode_macro LIGHTS_TOGGLE]
description: Toggle chamber LED lights on or off
gcode:
    {% if printer["output_pin Case_Light"].value > 0 %}
        LIGHTS_OFF
    {% else %}
        LIGHTS_ON
    {% endif %}

[gcode_macro M355]
description: Set case light (M355 S1 = ON, M355 S0 = OFF)
gcode:
    {% set S = params.S|default(1)|int %}
    {% if S == 1 %}
        LIGHTS_ON
    {% else %}
        LIGHTS_OFF
    {% endif %}

[gcode_macro M600]
description: Filament change pause (for slicer color changes and layer pauses)
gcode:
    PAUSE

[gcode_macro LOAD_FILAMENT]
description: Load filament through Bowden tube to nozzle
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    {% set DISTANCE = params.DISTANCE|default(450)|float %}
    {% set PURGE = params.PURGE|default(50)|float %}
    SAVE_GCODE_STATE NAME=load_state
    {% if printer.extruder.temperature < 180 %}
        {action_respond_info("Heating extruder to " ~ TEMP ~ "C for filament loading...")}
        M109 S{TEMP}
    {% endif %}
    M83 ; relative extrusion
    G92 E0
    M117 Loading filament...
    G1 E{DISTANCE} F2000 ; fast feed through Bowden tube
    G1 E{PURGE} F200 ; slow purge through hotend nozzle
    G1 E-2 F1800 ; small retract to prevent drool
    M117 Filament Loaded
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from nozzle back through Bowden tube
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    {% set DISTANCE = params.DISTANCE|default(500)|float %}
    SAVE_GCODE_STATE NAME=unload_state
    {% if printer.extruder.temperature < 180 %}
        {action_respond_info("Heating extruder to " ~ TEMP ~ "C for filament unloading...")}
        M109 S{TEMP}
    {% endif %}
    M83 ; relative extrusion
    G92 E0
    M117 Unloading filament...
    G1 E10 F300 ; push forward slightly to soften tip
    G1 E-15 F3000 ; quick retract to form clean tip
    G4 P1000 ; wait 1 second
    G1 E-{DISTANCE} F2000 ; fast extract through Bowden tube
    M117 Filament Unloaded
    RESTORE_GCODE_STATE NAME=unload_state


; An idea for using the heated bed of a 3D printer as a filament dryer.
; Adds GCODE command: START_DRYER TIME=T TEMPERATURE=C CHAMBER=C
; (T is time in seconds, C is temperature in Celsuis)
; To stop drying early, use STOP_DRYER.
; Also defined some utility macros: DRY_PLA, DRY_PETG and DRY_ABS.
; Edit these with your own preferred defaults.

[gcode_macro START_DRYER]
gcode:
    {% set TIME = params.TIME|default(14400)|int %}
    {% set TEMPERATURE = params.TEMPERATURE|default(50)|float %}
    M140 S{TEMPERATURE} ; Sets the print bed temperature without waiting.
    SET_GCODE_VARIABLE MACRO=DRYER_STATUS VARIABLE=time_remaining VALUE={TIME}
    SET_GCODE_VARIABLE MACRO=DRYER_STATUS VARIABLE=bed_temperature VALUE={TEMPERATURE}
    SET_IDLE_TIMEOUT TIMEOUT={TIME + 1800} ; Prevent heater timeout during drying
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=1
    M117 Drying Started

[gcode_macro STOP_DRYER]
gcode:
    M140 S0 ; Disable bed heater
    SET_GCODE_VARIABLE MACRO=DRYER_STATUS VARIABLE=time_remaining VALUE=0
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0 ; Stop the timer
    SET_IDLE_TIMEOUT TIMEOUT=600 ; Restore default 10min idle timeout
    M117 Drying Stopped

[gcode_macro DRYER_STATUS]
variable_time_remaining: 0
variable_bed_temperature: 0
gcode:
    {% if time_remaining > 0 %}
        M140 S{bed_temperature} ; Maintain bed temperature
        SET_GCODE_VARIABLE MACRO=DRYER_STATUS VARIABLE=time_remaining VALUE={time_remaining - 60}
        M117 Drying: { (time_remaining / 60)|int }m
    {% else %}
        STOP_DRYER
    {% endif %}

[delayed_gcode DRYER_TIMER]
gcode:
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=60
    DRYER_STATUS

[gcode_macro DRY_PLA]
gcode:
    START_DRYER TEMPERATURE=50 TIME=14400

[gcode_macro DRY_PETG]
gcode:
    START_DRYER TEMPERATURE=55  TIME=18000

[gcode_macro DRY_ABS]
gcode:
    START_DRYER TEMPERATURE=65 TIME=14400
